name: AI Red Team CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        
    - name: Install dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt || true # Use poetry or just rely on manual pip setup if reqs file is available
        pip install pytest httpx
        # We assume requirements are in pyproject.toml but installing minimally for test
        pip install "fastapi[all]" sqlalchemy prometheus-client pydantic httpx pytest anyio 
        
    - name: Run backend tests
      working-directory: ./backend
      run: |
        export PYTHONPATH=$PYTHONPATH:$(pwd)
        pytest tests/

  frontend-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        
    - name: Install dependencies
      working-directory: ./frontend
      run: npm install
      
    - name: Build frontend
      working-directory: ./frontend
      run: npm run build
